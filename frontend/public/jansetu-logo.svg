<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="50%" stop-color="#0F2B48" />
      <stop offset="100%" stop-color="#071426" />
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Squircle -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bgGrad)" stroke="#1E3A5F" stroke-width="3" />
  
  <!-- Subtle Outer Halo / Ashoka Chakra Glow -->
  <circle cx="128" cy="120" r="82" stroke="#1E3A5F" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
  <circle cx="128" cy="120" r="64" stroke="#38BDF8" stroke-width="1" opacity="0.3" />

  <!-- The Setu (Arch Bridge) — Foundation of Citizen Access -->
  <!-- Upper Arch Ribbon (Tri-color flow) -->
  <path d="M 44 176 C 72 110, 184 110, 212 176" 
        stroke="url(#bridgeGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        filter="url(#glow)" />
  
  <!-- Lower Arch / Base -->
  <path d="M 52 186 C 80 134, 176 134, 204 186" 
        stroke="#38BDF8" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        opacity="0.8" />

  <!-- Vertical Suspension Cables / Knowledge Graph Connectors -->
  <line x1="78" y1="147" x2="78" y2="183" stroke="#94A3B8" stroke-width="1.5" opacity="0.5" stroke-dasharray="2 2" />
  <line x1="102" y1="128" x2="102" y2="185" stroke="#94A3B8" stroke-width="1.5" opacity="0.5" stroke-dasharray="2 2" />
  <line x1="128" y1="120" x2="128" y2="186" stroke="#38BDF8" stroke-width="2" opacity="0.7" />
  <line x1="154" y1="128" x2="154" y2="185" stroke="#94A3B8" stroke-width="1.5" opacity="0.5" stroke-dasharray="2 2" />
  <line x1="178" y1="147" x2="178" y2="183" stroke="#94A3B8" stroke-width="1.5" opacity="0.5" stroke-dasharray="2 2" />

  <!-- Central Ashoka Chakra & Neural AI Nexus -->
  <g transform="translate(128, 96)">
    <!-- Chakra Center Disc -->
    <circle cx="0" cy="0" r="28" fill="#0A192F" stroke="url(#saffronGrad)" stroke-width="3" filter="url(#glow)" />
    <circle cx="0" cy="0" r="14" fill="#0F2B48" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" />

    <!-- 12 Stylized Geometric Spokes (Ashoka Dharma / AI Graph Rays) -->
    <g stroke="url(#goldGlow)" stroke-width="1.8" stroke-linecap="round" opacity="0.9">
      <line x1="0" y1="-7" x2="0" y2="-25" />
      <line x1="0" y1="7" x2="0" y2="25" />
      <line x1="-7" y1="0" x2="-25" y2="0" />
      <line x1="7" y1="0" x2="25" y2="0" />
      <line x1="-5" y1="-5" x2="-18" y2="-18" />
      <line x1="5" y1="5" x2="18" y2="18" />
      <line x1="-5" y1="5" x2="-18" y2="18" />
      <line x1="5" y1="-5" x2="18" y2="-18" />
    </g>

    <!-- Satellite Graph Nodes (Citizen, Law, Scheme, Land) -->
    <!-- Top Citizen Node (Saffron) -->
    <circle cx="0" cy="-48" r="6" fill="url(#saffronGrad)" stroke="#FFFFFF" stroke-width="1.5" />
    <line x1="0" y1="-28" x2="0" y2="-42" stroke="#FF9933" stroke-width="2" />

    <!-- Left Legal / Statutory Node (Sky Blue) -->
    <circle cx="-46" cy="-16" r="5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.2" />
    <line x1="-27" y1="-9" x2="-41" y2="-14" stroke="#38BDF8" stroke-width="1.5" />

    <!-- Right Scheme / Benefit Node (Emerald Green) -->
    <circle cx="46" cy="-16" r="5" fill="url(#greenGrad)" stroke="#FFFFFF" stroke-width="1.2" />
    <line x1="27" y1="-9" x2="41" y2="-14" stroke="#10B981" stroke-width="1.5" />
  </g>

  <!-- Base Bridge Road Deck -->
  <path d="M 36 190 Q 128 178 220 190" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round" opacity="0.9" />

  <!-- Tricolor Accent Bar at Base -->
  <rect x="74" y="210" width="34" height="4" rx="2" fill="#FF9933" />
  <rect x="111" y="210" width="34" height="4" rx="2" fill="#FFFFFF" />
  <rect x="148" y="210" width="34" height="4" rx="2" fill="#10B981" />
</svg>
