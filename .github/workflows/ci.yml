name: DocsAI DevOps & DevSecOps CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  security-events: write

jobs:
  # ── 1. DevSecOps: SAST & Dependency Auditing ──────────────────────────────
  security-audit:
    name: Security SAST & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit

      - name: Lint with Ruff
        run: |
          ruff check backend/app eval/

      - name: SAST Scan with Bandit
        run: |
          bandit -r backend/app -ll -ii -x backend/app/tests,backend/data

      - name: Dependency Audit (pip-audit)
        run: |
          pip-audit -r backend/requirements.txt --ignore-vuln CVE-2024-34062 || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Frontend Dependency Audit (npm audit)
        run: |
          cd frontend
          npm audit --audit-level=moderate || true

  # ── 2. Backend Unit Tests & Grounding Eval ────────────────────────────────
  backend-test:
    name: Backend Tests & Grounding Verification
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (PyMuPDF & Tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-hin tesseract-ocr-tam libglib2.0-0 libsm6 libxrender1 libxext6

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -m spacy download en_core_web_sm

      - name: Run Phase 4 Security Verification Suite
        env:
          PYTHONPATH: backend
        run: |
          python eval/test_phase4_security.py
          python eval/test_india_ai_features.py

  # ── 3. Frontend Build Verification ────────────────────────────────────────
  frontend-build:
    name: Frontend Build & Asset Verification
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install NPM Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

  # ── 4. DevSecOps: Trivy Filesystem & Container Security Scan ───────────────
  security-trivy:
    name: Trivy DevSecOps Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Trivy Filesystem, Secret & Config Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Build Backend Docker Image
        run: |
          docker build -t docsai-backend:ci -f Dockerfile .

      - name: Trivy Backend Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: docsai-backend:ci
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Build Frontend Docker Image
        run: |
          docker build -t docsai-frontend:ci -f frontend/Dockerfile frontend

      - name: Trivy Frontend Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: docsai-frontend:ci
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
