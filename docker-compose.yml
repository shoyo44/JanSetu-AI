version: "3.9"

services:
  # ── Backend: DocsAI Core RAG Engine ───────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docsai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GRAPH_STORE_DIR=/app/backend/data
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - graph_data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy

  # ── Frontend: React / Vite SPA via Hardened Nginx ─────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docsai_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  # ── Caching & Ephemeral Store (Redis) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: docsai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── On-Premise Ollama Daemon (Data Sovereignty Profile) ───────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: docsai_ollama
    profiles: ["onprem"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Metrics Collection (Prometheus) ───────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: jansetu_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      backend:
        condition: service_healthy

  # ── Sovereign Observability Dashboard (Grafana) ───────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: jansetu_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  graph_data:
    name: docsai_graph_data
  redis_data:
    name: docsai_redis_data
  ollama_data:
    name: docsai_ollama_data
  prometheus_data:
    name: jansetu_prometheus_data
  grafana_data:
    name: jansetu_grafana_data

